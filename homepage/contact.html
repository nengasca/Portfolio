<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <section id="contact" class="index-section">
    <div class="container profile-container">
      <div class="profile-card">
        
        <nav class="top-nav">
          <div class="nav-left"></div>
          <div class="nav-right">
            <a href="index.html" class="nav-link"></i> Profile</a>
            <a href="showcase.html" class="nav-link"></i> Showcase</a>
            <a href="contact.html" class="nav-link"></i> Contact</a>
          </div>
        </nav>
        
        <div class="contact-grid">
          <div class="contact-info">
            <div class="info-item">
              <i class="fas fa-envelope"></i>
              <span>maylojanen@gmail.com</span>
            </div>
            <div class="info-item">
              <i class="fas fa-phone-alt"></i>
              <span>09355465155</span>
            </div>
            <div class="info-item">
              <i class="fas fa-map-pin"></i>
              <span>Colon, City of Naga, Cebu</span>
            </div>
            
            <div class="social-links">
              <a href="https://github.com/nengasca" aria-label="GitHub" target="_blank"><i class="fab fa-github"></i></a>
              <a href="https://www.facebook.com/m.nengasca" aria-label="Facebook" target="_blank"><i class="fab fa-facebook"></i></a>
              <a href="https://www.instagram.com/m_nngasca" aria-label="Instagram" target="_blank"><i class="fab fa-instagram"></i></a>
              <a href="https://www.tiktok.com/@_itsurgurl_jane?is_from_webapp=1&sender_device=pc" aria-label="TikTok" target="_blank"><i class="fab fa-tiktok"></i></a>
              <a href="https://t.me/Lojane" aria-label="Telegram" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            </div>
          </div>

          <div class="contact-form">
            <form id="contactForm" action="#" method="post">
              <div class="form-group">
                <label for="name"><i class="fas fa-user"></i> Full name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required />
              </div>
              <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
              </div>
              <div class="form-group">
                <label for="message"><i class="fas fa-comment"></i> Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Tell me about your project..." required></textarea>
              </div>
              <button type="submit" class="btn primary-btn full-width">
                <i class="fas fa-paper-plane"></i> Send message
              </button>
            </form>
            <p class="form-note">I'll get back to you within 24 hours.</p>
        </div>
        
      </div>
    </div>
  </section>

  <script src="../js/script.js"></script>  
</body>
</html>
